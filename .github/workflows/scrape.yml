name: Scrape Lotto Data

on:
  schedule:
    # รันทุกชั่วโมง 15:00-21:00 น. (UTC+7 = 08:00-14:00 UTC)
    # ครอบคลุมวันที่ 1,2,3 และ 16,17,18 ของทุกเดือน
    # การออกรางวัลเริ่ม 14:30 แต่ รางวัลที่ 1 / เลขหน้า 3 ตัว / เลขท้าย 3 ตัว
    # ออกช่วงท้าย ๆ รอบ 15:00 จึงมักได้ผลไม่ครบ ต้องมีรอบถัดไปมาเก็บซ้ำ
    # scrape.py จะไม่บันทึกงวดที่ผลยังไม่ครบ และจะ scrape ซ้ำให้เองจนกว่าจะครบ
    - cron: '0 8-14 1-3,16-18 * *'
  workflow_dispatch: # รันด้วยตัวเองได้จาก Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update lotto data $(date +'%d/%m/%Y %H:%M')"
          git push